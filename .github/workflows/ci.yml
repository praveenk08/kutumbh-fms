name: Kutumbh FMS - CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build, Lint & Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: kutumbh_fms
          MYSQL_USER: fms_user
          MYSQL_PASSWORD: fmspassword123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Verify Code Syntax & Formatting
        run: npm run test:lint --if-present

      - name: Seed Database Schema
        run: |
          SCHEMA_FILE=$(find . -name "init_mysql.sql" | head -n 1)
          echo "Found schema file at: $SCHEMA_FILE"
          mysql -h 127.0.0.1 -P 3306 -u fms_user -pfmspassword123 kutumbh_fms < "$SCHEMA_FILE"

      - name: Execute Automated Test Suites
        env:
          NODE_ENV: test
          PORT: 5001
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: fms_user
          DB_PASSWORD: fmspassword123
          DB_NAME: kutumbh_fms
          DISTRICT_PREFIX: BAL
        run: npm test