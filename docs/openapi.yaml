openapi: 3.0.0
info:
  title: Kutumbh FMS API
  version: 2.0.0
  description: Gram Panchayat Digital Family Management System & Census Platform API Documentation
  contact:
    name: Praveen Kumar
    email: pk46066@gmail.com

servers:
  - url: http://localhost:5000
    description: Local Development Server

paths:
  /api/v1/families:
    get:
      summary: Search and paginate families
      tags:
        - Families
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search by Head Name or Family Token
        - in: query
          name: village
          schema:
            type: string
          description: Village name filter
        - in: query
          name: rationCardCategory
          schema:
            type: string
            enum: [AAY, BPL, APL, NONE]
        - in: query
          name: verificationStatus
          schema:
            type: string
            enum: [PENDING, VERIFIED, REJECTED]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of families retrieved successfully.

    post:
      summary: Register a new family unit with members
      tags:
        - Families
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyRegistrationInput'
      responses:
        '201':
          description: Family registered successfully.
        '400':
          description: Validation error.

  /api/v1/families/{familyToken}:
    get:
      summary: Retrieve family details along with all active members
      tags:
        - Families
      parameters:
        - in: path
          name: familyToken
          required: true
          schema:
            type: string
          example: BAL-2026-052382
      responses:
        '200':
          description: Full family profile retrieved.
        '404':
          description: Family not found.

  /api/v1/families/{familyToken}/verify:
    patch:
      summary: Update administrative verification status
      tags:
        - Families
      parameters:
        - in: path
          name: familyToken
          required: true
          schema:
            type: string
          example: BAL-2026-052382
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusVerificationInput'
      responses:
        '200':
          description: Status updated successfully.

  /api/v1/families/{familyToken}/members:
    post:
      summary: Add an individual member to an existing family
      tags:
        - Members
      parameters:
        - in: path
          name: familyToken
          required: true
          schema:
            type: string
          example: BAL-2026-052382
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '201':
          description: Member added successfully.

  /api/v1/members/{memberId}:
    put:
      summary: Update member details dynamically
      tags:
        - Members
      parameters:
        - in: path
          name: memberId
          required: true
          schema:
            type: string
          example: "2"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                occupation:
                  type: string
                  example: Business
                education:
                  type: string
                  example: Graduate
      responses:
        '200':
          description: Member updated successfully.

    delete:
      summary: Soft-delete / deactivate member
      tags:
        - Members
      parameters:
        - in: path
          name: memberId
          required: true
          schema:
            type: string
          example: "2"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Migrated to Delhi for work
      responses:
        '200':
          description: Member deactivated successfully.

components:
  schemas:
    MemberInput:
      type: object
      required:
        - fullName
        - gender
      properties:
        fullName:
          type: string
          example: Rahul Prasad
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          example: MALE
        dob:
          type: string
          format: date
          example: '2005-06-12'
        relationshipWithHead:
          type: string
          example: SON
        maritalStatus:
          type: string
          example: UNMARRIED
        educationalQualification:
          type: string
          example: Intermediate
        primaryOccupation:
          type: string
          example: Student

    FamilyRegistrationInput:
      type: object
      required:
        - familyData
        - membersData
      properties:
        familyData:
          type: object
          required:
            - headName
            - guardianName
          properties:
            headName:
              type: string
              example: Ramesh Kumar Verma
            guardianName:
              type: string
              example: Shri Ramkishun Verma
            contactNumber:
              type: string
              example: '9876543210'
            habitation:
              type: object
              properties:
                state:
                  type: string
                  example: Uttar Pradesh
                district:
                  type: string
                  example: Ballia
                block:
                  type: string
                  example: Dubahar
                village:
                  type: string
                  example: Rustampur
                habitationName:
                  type: string
                  example: Purwa
            economicProfile:
              type: object
              properties:
                rationCardCategory:
                  type: string
                  enum: [AAY, BPL, APL, NONE]
                  example: BPL
                annualIncome:
                  type: number
                  example: 48000
        membersData:
          type: array
          items:
            $ref: '#/components/schemas/MemberInput'

    StatusVerificationInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [VERIFIED, REJECTED, PENDING]
          example: VERIFIED
        verifiedBy:
          type: string
          example: ADMIN_OFFICER